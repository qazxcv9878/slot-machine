<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漂亮妤潔寶 🎀</title>
    <style>
        /* 背景改成夢幻粉紅與馬卡龍紫漸層 */
        body {
            background: linear-gradient(135deg, #ffd1ff, #fad0c4);
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #ff6b81;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 2.8rem;
            color: #fff;
            /* 粉紅甜心發光字體效果 */
            text-shadow:  2px  2px 0px #ff6b81,
                         -2px -2px 0px #ff6b81,
                          2px -2px 0px #ff6b81,
                         -2px  2px 0px #ff6b81,
                          0px  0px 15px rgba(255, 107, 129, 0.6);
            letter-spacing: 1px;
        }

        /* 拉霸機外框：草莓牛奶粉 + 澎澎圓潤邊框 */
        .slot-machine {
            background: #fff0f5;
            border: 8px solid #ffb7c5;
            border-radius: 30px;
            padding: 25px 35px;
            box-shadow: 0 10px 0px #ff9aa2, 
                        0 15px 25px rgba(255, 154, 162, 0.4);
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            position: relative;
        }

        /* 單個轉輪：圓角、白色背景、嫩粉色細邊框 */
        .reel {
            background-color: #ffffff;
            width: 120px;
            height: 120px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffe4e1;
            box-shadow: inset 0 0 10px rgba(255, 182, 193, 0.3),
                        0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden; 
        }

        /* 圖片滿版且完美置中 */
        .reel img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        /* 糖果蜜桃粉按鈕 */
        button {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0px #ff758c,
                        0 10px 15px rgba(255, 117, 140, 0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            transition: all 0.1s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #ff758c, #ff758c);
            box-shadow: 0 6px 0px #e04d68,
                        0 10px 20px rgba(255, 117, 140, 0.5);
            transform: translateY(-2px);
        }

        button:active {
            box-shadow: 0 2px 0px #e04d68,
                        0 4px 5px rgba(255, 117, 140, 0.3);
            transform: translateY(4px);
        }

        button:disabled {
            background: #e0e0e0;
            color: #aaaaaa;
            box-shadow: 0 6px 0px #b5b5b5;
            transform: none;
            cursor: not-allowed;
        }

        /* 狀態訊息 */
        #message {
            margin-top: 15px;
            font-size: 26px;
            font-weight: bold;
            height: 35px;
            color: #ff4757;
            text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff;
        }
    </style>
</head>
<body>

    <h1>🎰 漂亮妤潔寶 🎰</h1>
<div class="slot-machine">
    <div id="reel1" class="reel"><img src="pic1.jpg.jpg"></div>
    <div id="reel2" class="reel"><img src="pic1.jpg.jpg"></div>
    <div id="reel3" class="reel"><img src="pic1.jpg.jpg"></div>
</div>

    <button id="spin-btn" onclick="spin()">開始中獎！</button>

    <div id="message"></div>

    <script>
        // 定義拉霸機裡面的圖標
        const symbols = ['pic1.jpg.jpg', 'pic2.jpg.jpg', 'pic3.jpg.jpg', 'pic4.jpg.jpg', 'pic5.jpg.jpg'];

function spin() {
    const btn = document.getElementById('spin-btn');
    const msg = document.getElementById('message');
    const reel1 = document.getElementById('reel1');
    const reel2 = document.getElementById('reel2');
    const reel3 = document.getElementById('reel3');

    btn.disabled = true;
    msg.textContent = "轉動中...";

    let count = 0;
    const interval = setInterval(() => {
        // 2. 滾動時隨機更換圖片 HTML
        const s1 = symbols[Math.floor(Math.random() * symbols.length)];
        const s2 = symbols[Math.floor(Math.random() * symbols.length)];
        const s3 = symbols[Math.floor(Math.random() * symbols.length)];
        
        reel1.innerHTML = `<img src="${s1}" style="width:80%; height:80%;">`;
        reel2.innerHTML = `<img src="${s2}" style="width:80%; height:80%;">`;
        reel3.innerHTML = `<img src="${s3}" style="width:80%; height:80%;">`;
        count++;

        if (count >= 20) {
            clearInterval(interval);
            
            const res1 = symbols[Math.floor(Math.random() * symbols.length)];
            const res2 = symbols[Math.floor(Math.random() * symbols.length)];
            const res3 = symbols[Math.floor(Math.random() * symbols.length)];

            reel1.innerHTML = `<img src="${res1}" style="width:80%; height:80%;">`;
            reel2.innerHTML = `<img src="${res2}" style="width:80%; height:80%;">`;
            reel3.innerHTML = `<img src="${res3}" style="width:80%; height:80%;">`;

            // 3. 判斷圖片名稱是否相同
            if (res1 === res2 && res2 === res3) {
                msg.textContent = "🎉 信義小辣妹！妤潔寶！ 🎉";
                msg.style.color = "#2ecc71";
            } else {
                msg.textContent = "猜猜我是誰！ ";
                msg.style.color = "#e74c3c";
            }

            btn.disabled = false;
        }
    }, 50);; // 每 50 毫秒跳動一次
        }
    </script>

</body>
</html>
